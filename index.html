<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta name="theme-color" content="#111827">

<link
  rel="manifest"
  href="manifest.webmanifest"
>

<link
  rel="apple-touch-icon"
  href="icon-192.png"
>

<title>Toy Car Tilt Remote</title>

<style>

body {
  margin:0;
  background:#0b1020;
  color:#f8fafc;
  font-family:system-ui,-apple-system,sans-serif;
  display:flex;
  justify-content:center;
}

main {
  width:min(680px,100%);
  padding:20px;
  box-sizing:border-box;
}

.card {
  background:#151b2f;
  border:1px solid #2d3756;
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
}

.status {
  font-size:2rem;
  font-weight:800;
  text-align:center;
  padding:24px 10px;
  border-radius:16px;
  background:#27324d;
}

.status.go {
  background:#14532d;
  color:#dcfce7;
}

.status.stop {
  background:#7f1d1d;
  color:#fee2e2;
}

.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:14px;
}

button {
  min-height:52px;
  border:0;
  border-radius:14px;
  font-size:1rem;
  font-weight:700;
  padding:12px 14px;
  background:#2563eb;
  color:#fff;
}

button.secondary {
  background:#334155;
}

button.danger {
  background:#b91c1c;
}

input[type=range] {
  width:100%;
}

.small {
  color:#aeb9d1;
  font-size:.9rem;
  line-height:1.4;
}

.numbers {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}

.num {
  background:#0f172a;
  padding:10px;
  border-radius:12px;
  text-align:center;
}

.num b {
  display:block;
  font-size:1.2rem;
  margin-top:4px;
}

.connected {
  color:#86efac;
  font-weight:700;
}

.disconnected {
  color:#fca5a5;
  font-weight:700;
}

</style>
</head>


<body>

<main>

<h1>Toy Car Tilt Remote</h1>


<section class="card">

<div
  id="driveState"
  class="status"
>
NOT STARTED
</div>


<div class="grid">

<button id="startBtn">
Start Tilt Control
</button>

<button
  id="neutralBtn"
  class="secondary"
>
Set Neutral
</button>

</div>


<div class="grid">

<button
  id="stopBtn"
  class="danger"
>
EMERGENCY STOP
</button>

<button
  id="testBtn"
  class="secondary"
>
Test Forward
</button>

</div>

</section>


<section class="card">

<label>
Forward threshold:
<span id="thresholdValue">12</span>°
</label>

<input
  id="threshold"
  type="range"
  min="5"
  max="35"
  value="12"
>

<p class="small">
Hold the phone normally, tap Set Neutral,
then tilt the top of the phone forward.
</p>

</section>


<section class="card">

<strong>
Phone orientation
</strong>

<div class="numbers">

<div class="num">
Beta
<b id="beta">0.0°</b>
</div>

<div class="num">
Gamma
<b id="gamma">0.0°</b>
</div>

<div class="num">
Forward Δ
<b id="delta">0.0°</b>
</div>

</div>

</section>


<section class="card">

<strong>
ESP32 connection
</strong>

<p>
MQTT:
<span
  id="mqttStatus"
  class="disconnected"
>
CONNECTING...
</span>
</p>

<p
  id="command"
  class="small"
>
GPIO23 = LOW
</p>

<p class="small">
Phone tilt → MQTT → ESP32 → GPIO23 → PC817 → LED
</p>

</section>


<!-- MQTT library -->
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>


<script>

(() => {


// =================================================
// PAGE ELEMENTS
// =================================================

const $ =
  id => document.getElementById(id);


const startBtn =
  $('startBtn');

const neutralBtn =
  $('neutralBtn');

const stopBtn =
  $('stopBtn');

const testBtn =
  $('testBtn');

const threshold =
  $('threshold');

const thresholdValue =
  $('thresholdValue');

const driveState =
  $('driveState');

const betaEl =
  $('beta');

const gammaEl =
  $('gamma');

const deltaEl =
  $('delta');

const commandEl =
  $('command');

const mqttStatus =
  $('mqttStatus');


// =================================================
// PHONE STATE
// =================================================

let enabled = false;

let stopped = false;

let neutralBeta = 0;

let beta = 0;

let gamma = 0;

let haveSensor = false;


// =================================================
// MQTT
// =================================================

const forwardTopic =
  "toycar/8f3a91c7e2b64d10/forward";
const backwardTopic =
  "toycar/8f3a91c7e2b64d10/backward";

const mqttClient =
  mqtt.connect(
    "wss://broker.hivemq.com:8884/mqtt",
    {
      clientId:
        "ToyCarPhone-" +
        Math.random()
          .toString(16)
          .slice(2),

      reconnectPeriod: 2000,

      connectTimeout: 10000
    }
  );


// MQTT connected

mqttClient.on(
  "connect",
  () => {

    console.log(
      "MQTT CONNECTED"
    );

    mqttStatus.textContent =
      "CONNECTED";

    mqttStatus.className =
      "connected";


    // Start safely OFF
    mqttClient.publish(
      forwardTopic,
      "0"
    );

  }
);


// MQTT reconnecting

mqttClient.on(
  "reconnect",
  () => {

    mqttStatus.textContent =
      "RECONNECTING...";

    mqttStatus.className =
      "disconnected";

  }
);


// MQTT disconnected

mqttClient.on(
  "close",
  () => {

    mqttStatus.textContent =
      "DISCONNECTED";

    mqttStatus.className =
      "disconnected";

  }
);


// MQTT error

mqttClient.on(
  "error",
  error => {

    console.log(
      "MQTT error:",
      error
    );

    mqttStatus.textContent =
      "ERROR";

    mqttStatus.className =
      "disconnected";

  }
);


// =================================================
// SEND FORWARD COMMAND
// =================================================

function sendForward(on) {

  if (!mqttClient.connected) {
    return;
  }

  mqttClient.publish(
    forwardTopic,
    on ? "1" : "0"
  );

}


// =================================================
// SET FORWARD STATE
// =================================================

function setForward(on) {

  if (stopped) {
    on = false;
  }


  driveState.textContent =
    on
      ? "FORWARD"
      : (
          stopped
            ? "STOPPED"
            : "NEUTRAL"
        );


  driveState.classList.toggle(
    "go",
    on
  );


  driveState.classList.toggle(
    "stop",
    stopped
  );


  commandEl.textContent =
    "GPIO23 = " +
    (
      on
        ? "HIGH"
        : "LOW"
    );


  // Send to real ESP32
  sendForward(on);

}


// =================================================
// PROCESS PHONE ANGLE
// =================================================

function update() {

  const delta =
    neutralBeta - beta;


  deltaEl.textContent =
    delta.toFixed(1) + "°";


  if (
    !enabled ||
    !haveSensor ||
    stopped
  ) {

    setForward(false);

    return;
  }


  const forward =
    delta >=
    Number(
      threshold.value
    );


  setForward(
    forward
  );

}


// =================================================
// PHONE ORIENTATION EVENT
// =================================================

function onOrientation(e) {

  if (
    typeof e.beta !==
    "number"
  ) {

    return;
  }


  haveSensor = true;


  beta =
    e.beta;


  gamma =
    typeof e.gamma ===
    "number"
      ? e.gamma
      : 0;


  betaEl.textContent =
    beta.toFixed(1) +
    "°";


  gammaEl.textContent =
    gamma.toFixed(1) +
    "°";


  update();

}


// =================================================
// START TILT SENSOR
// =================================================

async function start() {

  try {

    if (
      typeof DeviceOrientationEvent !==
      "undefined" &&

      typeof DeviceOrientationEvent
        .requestPermission ===
      "function"
    ) {

      const permission =
        await DeviceOrientationEvent
          .requestPermission();


      if (
        permission !==
        "granted"
      ) {

        driveState.textContent =
          "PERMISSION DENIED";

        driveState.classList.add(
          "stop"
        );

        return;
      }

    }


    window.addEventListener(
      "deviceorientation",
      onOrientation,
      true
    );


    enabled = true;

    stopped = false;


    startBtn.textContent =
      "Tilt Control Active";


    update();

  }


  catch(error) {

    driveState.textContent =
      "SENSOR ERROR";


    driveState.classList.add(
      "stop"
    );


    commandEl.textContent =
      String(error);

  }

}


// =================================================
// BUTTONS
// =================================================


// Start tilt

startBtn.addEventListener(
  "click",
  start
);


// Set current phone position
// as neutral

neutralBtn.addEventListener(
  "click",
  () => {

    neutralBeta =
      beta;

    stopped =
      false;

    update();

  }
);


// Emergency stop

stopBtn.addEventListener(
  "click",
  () => {

    stopped =
      true;

    setForward(
      false
    );

  }
);


// Manual test button

testBtn.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();

    stopped =
      false;

    setForward(
      true
    );

  }
);


[
  "pointerup",
  "pointercancel",
  "pointerleave"
]
.forEach(
  eventName => {

    testBtn.addEventListener(
      eventName,
      () => {

        setForward(
          false
        );

      }
    );

  }
);


// Threshold adjustment

threshold.addEventListener(
  "input",
  () => {

    thresholdValue.textContent =
      threshold.value;

    update();

  }
);


// =================================================
// MQTT HEARTBEAT
// =================================================
//
// Sends the current state repeatedly.
//
// Your ESP32 turns GPIO23 OFF if
// these messages disappear for
// more than 1 second.
//
// =================================================

setInterval(
  () => {

    if (
      !mqttClient.connected
    ) {

      return;
    }


    const forward =
      enabled &&
      !stopped &&
      haveSensor &&
      (
        neutralBeta - beta >=
        Number(
          threshold.value
        )
      );


    mqttClient.publish(
      forwardTopic,
      forward
        ? "1"
        : "0"
    );

  },

  250
);


// =================================================
// SAFETY WHEN APP IS HIDDEN
// =================================================

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.hidden
    ) {

      stopped =
        true;

      setForward(
        false
      );

    }

  }
);


// =================================================
// SERVICE WORKER
// =================================================

if (
  "serviceWorker"
  in navigator
) {

  navigator
    .serviceWorker
    .register(
      "./sw.js"
    )
    .catch(
      () => {}
    );

}

})();

</script>


</main>

</body>

</html>
